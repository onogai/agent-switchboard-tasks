# Managed production Queue: one container, one process, one scheduler.
# Preserve both historical internal DNS names and ports for Core/Manager.
name: switchboard-tasks

services:
  tasks:
    image: switchboard-tasks:production
    build:
      context: .
      dockerfile: Dockerfile
    container_name: switchboard-tasks
    command: ["python", "-m", "task_queue.runtime"]
    user: "${HOST_UID:?Set host UID}:${HOST_GID:?Set host GID}"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
    env_file:
      - ./.env.production
    environment:
      HOME: /tmp
      QUEUE_DB_PATH: /data/queue.sqlite3
      TASKS_AUTHORITY_URL: http://infrastructure_admin:8768
    volumes:
      - ${TASKS_STATE_ROOT:?Set absolute existing Queue state directory}:/data
    networks:
      addons:
        aliases: [tasks_mcp, tasks_web]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; [socket.create_connection(('127.0.0.1', p), 2).close() for p in (8767, 8771)]"]
      interval: 20s
      timeout: 5s
      start_period: 20s
      retries: 3

networks:
  addons:
    external: true
    name: ${SWITCHBOARD_ADDONS_NETWORK:-switchboard_addons}
